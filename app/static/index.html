<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledgerly</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <!-- Auth screen -->
  <main id="auth-view" class="auth" hidden>
    <div class="card auth-card">
      <h1 class="logo">Ledgerly</h1>
      <p class="muted">Track income and spending. See where it goes.</p>
      <form id="auth-form">
        <label>Username <input name="username" autocomplete="username" required minlength="3"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
        <p id="auth-error" class="error" role="alert"></p>
        <button type="submit" id="auth-submit">Log in</button>
      </form>
      <p class="muted small">
        <span id="auth-switch-text">No account?</span>
        <button type="button" class="link" id="auth-switch">Create one</button>
      </p>
    </div>
  </main>

  <!-- Dashboard -->
  <div id="app-view" hidden>
    <header class="topbar">
      <span class="logo">Ledgerly</span>
      <div class="topbar-right">
        <input type="month" id="month" aria-label="Month">
        <span id="whoami" class="muted"></span>
        <button class="ghost" id="logout">Log out</button>
      </div>
    </header>

    <main class="dashboard">
      <section class="stats">
        <div class="card stat"><span class="muted">Income</span><strong id="stat-income">–</strong></div>
        <div class="card stat"><span class="muted">Expenses</span><strong id="stat-expenses">–</strong></div>
        <div class="card stat"><span class="muted">Net</span><strong id="stat-net">–</strong></div>
      </section>

      <section class="charts">
        <div class="card"><h2>Spending by category</h2><div class="chart-box"><canvas id="cat-chart"></canvas></div><p id="cat-empty" class="muted center" hidden>No expenses this month.</p></div>
        <div class="card"><h2>Last 6 months</h2><div class="chart-box"><canvas id="trend-chart"></canvas></div></div>
      </section>

      <section class="card">
        <h2 id="form-title">Add transaction</h2>
        <form id="tx-form" class="tx-form">
          <select name="kind" aria-label="Type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
          <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required aria-label="Amount">
          <input name="category" list="categories" placeholder="Category" required maxlength="40" aria-label="Category">
          <datalist id="categories">
            <option>Groceries</option><option>Rent</option><option>Transport</option>
            <option>Eating out</option><option>Bills</option><option>Fun</option><option>Salary</option>
          </datalist>
          <input name="description" placeholder="Description (optional)" maxlength="200" aria-label="Description">
          <input name="date" type="date" required aria-label="Date">
          <button type="submit" id="tx-submit">Add</button>
          <button type="button" class="ghost" id="tx-cancel" hidden>Cancel</button>
        </form>
        <p id="tx-error" class="error" role="alert"></p>
      </section>

      <section class="card">
        <div class="row">
          <h2>Transactions</h2>
          <a id="export" class="ghost button" href="#">Export CSV</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead>
            <tbody id="tx-body"></tbody>
          </table>
        </div>
        <p id="tx-empty" class="muted center" hidden>Nothing logged this month yet.</p>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
